<!DOCTYPE html>

<html>
    <head>
        <style>
            .photo{
                display: flex;
                flex-direction: row;
                border: 1px solid rgb(255, 255, 255);
                background-color: rgb(188, 135, 238);
                height: 50px;
                align-items: center;
                justify-content: space-around;
            }
            .home{
                font-family: arial;
                color: white;
                width: 60px;
            }
            input{
                border-radius: 15px;
                border-style: solid;
                flex: 1;
                width: 350px;
                border: none;
                height: 25px;
                padding-left: 15px;
            }
            button{
                width: 70px;
                color: white;
                background-color: rgb(188, 135, 238);
                border-color: rgb(255, 255, 255);
                border-style: solid;
                height: 30px;
                padding: 3px;
            }


        </style>
    </head>
    <body>
        <div class="photo">
            <div class="home">Home</div>
            <div>
                <input type="text" placeholder="Search">
            </div>
            <div>
                <button>Download</button>
            </div>
        </div>
    </body>
</html>
